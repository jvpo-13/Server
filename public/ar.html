<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Permite uso da câmera -->
  <meta http-equiv="Permissions-Policy" content="camera=(self)">
  <title>AR.js Funcional - Correções</title>
  
  <!-- Inclusão do A-Frame e AR.js (versões testadas) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.3.3/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  <!-- Configuração da cena com AR.js -->
  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; detectionMode: mono; debugUIEnabled: false; cameraParametersUrl: https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.3.3/data/data/camera_para.dat"
    renderer="logarithmicDepthBuffer: true; alpha: true;"
  >
    <!-- Marcador padrão Hiro -->
    <a-marker preset="hiro">
      <a-box position="0 0.5 0" color="yellow" scale="0.5 0.5 0.5"></a-box>
    </a-marker>

    <!-- Entidade da câmera -->
    <a-entity camera></a-entity>
  </a-scene>

  <!-- Script para verificação do acesso à câmera -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: true })
          .then(stream => {
            console.log('Câmera inicializada com sucesso');
            // Libera os tracks logo após a inicialização para não manter a câmera ligada desnecessariamente
            stream.getTracks().forEach(track => track.stop());
          })
          .catch(error => {
            console.error('Erro ao acessar a câmera:', error);
            alert('Erro ao acessar a câmera: ' + error.message);
          });
      } else {
        alert('Seu navegador não suporta acesso à câmera.');
      }
    });
  </script>
  <!-- 
    Observação:
    • Para que a câmera seja acessada de forma correta, certifique-se de servir esta página via HTTP(s) (por exemplo, utilizando um servidor local com "python -m http.server")
    • Certifique-se de que o marcador "Hiro" esteja sendo utilizado conforme o padrão. Você pode imprimir ou exibir na tela a imagem do marcador disponível em: 
      https://jeromeetienne.github.io/AR.js/data/images/hiro.png
  -->
</body>
</html>
